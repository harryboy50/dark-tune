name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Get tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          cp build/app/outputs/flutter-apk/app-release.apk "Dark-Tune-${TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.TAG }}
          name: Dark Tune Release ${{ steps.tag.TAG }}
          body: |
            ## Dark Tune ${{ steps.tag.TAG }}

            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources" in your device settings
            3. Install the APK file
          files: |
            Dark-Tune-${{ steps.tag.TAG }}.apk
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}